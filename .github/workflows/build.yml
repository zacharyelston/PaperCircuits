name: Build pages

# Rebuilds every page on each PR and on main. The build runs the copper clearance
# check, and the job fails if the committed PDFs or previews are out of date.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Test
        run: uv run --locked pytest

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Build every page and check the previews
        run: uv run --locked build.py --check
