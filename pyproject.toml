[project]
name = "papercircuits"
version = "0.1.0"
description = "Printable A4 paper-circuit workbook pages built to a shared page standard"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B007", "B905"]
